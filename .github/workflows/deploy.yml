name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/account-management
  DB_NAME: bankapp_usermanagement_db

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # STEP 1: CHECKOUT CODE
      # ============================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ============================================
      # STEP 2: SETUP JAVA
      # ============================================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # ============================================
      # STEP 3: BUILD JAR
      # ============================================
      - name: 📦 Build JAR with Maven
        run: mvn clean package -DskipTests

      # ============================================
      # STEP 4: LOGIN TO DOCKER HUB
      # ============================================
      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ============================================
      # STEP 5: SET UP DOCKER BUILDX
      # ============================================
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================
      # STEP 6: BUILD & PUSH DOCKER IMAGE
      # ============================================
      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================
      # STEP 7: CREATE .env FILE
      # ============================================
      - name: 📝 Create .env file
        run: |
          cat > .env.production << ENVEOF
          DB_URL=jdbc:postgresql://${{ secrets.RDS_ENDPOINT }}:5432/${{ env.DB_NAME }}
          DB_USERNAME=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION=86400000
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092
          SERVER_PORT=8080
          SERVER_ADDRESS=0.0.0.0
          ENVEOF

      # ============================================
      # STEP 8: SETUP SSH KEY
      # ============================================
      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_IP }} >> ~/.ssh/known_hosts

      # ============================================
      # STEP 9: DEPLOY TO EC2
      # ============================================
      - name: 🚀 Deploy to EC2
        env:
          EC2_IP: ${{ secrets.EC2_IP }}
        run: |
          # Copy files to EC2
          scp -i ~/.ssh/deploy_key.pem docker-compose.yml ec2-user@$EC2_IP:~/app/
          scp -i ~/.ssh/deploy_key.pem .env.production ec2-user@$EC2_IP:~/app/.env
          
          # Deploy on EC2
          ssh -i ~/.ssh/deploy_key.pem ec2-user@$EC2_IP << 'ENDSSH'
            cd ~/app
            echo "📥 Pulling latest Docker image..."
            docker-compose pull
            
            echo "🛑 Stopping old container..."
            docker-compose down
            
            echo "🚀 Starting new container..."
            docker-compose up -d
            
            echo "⏳ Waiting for application to start..."
            sleep 45
            
            echo "📊 Container status:"
            docker-compose ps
            
            echo "🔍 Checking application logs:"
            docker-compose logs --tail=20 | grep -E "Started|ERROR" || true
          ENDSSH

      # ============================================
      # STEP 10: HEALTH CHECK
      # ============================================
      - name: 🧪 Health check
        run: |
          echo "⏳ Waiting 15 seconds before health check..."
          sleep 15
          
          echo "🔍 Testing health endpoint..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_IP }}:8080/actuator/health)
          
          echo "Health check HTTP status: $RESPONSE"
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Health check passed!"
            curl -s http://${{ secrets.EC2_IP }}:8080/actuator/health
          else
            echo "❌ Health check failed with status: $RESPONSE"
            exit 1
          fi

      # ============================================
      # STEP 11: CLEANUP OLD DOCKER IMAGES
      # ============================================
      - name: 🧹 Cleanup old images on EC2
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key.pem ec2-user@${{ secrets.EC2_IP }} << 'CLEANUP'
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -af --filter "until=24h"
            echo "✅ Cleanup complete"
          CLEANUP

      # ============================================
      # STEP 12: NOTIFY STATUS
      # ============================================
      - name: 📢 Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 🎉 Deployment completed successfully!"
            echo "🌐 Application is live at: http://${{ secrets.EC2_IP }}:8080"
          else
            echo "❌ Deployment failed. Check logs above."
          fi