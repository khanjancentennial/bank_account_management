spring.application.name=bank-account-management

# Database Configuration - USE ENVIRONMENT VARIABLES IN PRODUCTION
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankapp_usermanagement_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Khanjan123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=bank-account-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.bankaccountmanagement.bank_account_management.Event.TransactionEvent
spring.kafka.listener.missing-topics-fatal=false

# Kafka Topic Configuration
kafka.topic.transaction=bank-transactions

# JWT Configuration - USE ENVIRONMENT VARIABLES IN PRODUCTION
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}

# Server Configuration
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Async Configuration for Audit Logging
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Logging Configuration
logging.level.root=INFO
logging.level.com.bankaccountmanagement=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Enable async processing
spring.task.execution.thread-name-prefix=async-


# ===================================
# ACTUATOR CONFIGURATION (for AWS health checks)
# ===================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Application Info
info.app.name=Account Management Microservice
info.app.version=1.0.0
info.app.description=Banking Account Management with Enterprise Security
